<style>
        .skeleton-shimmer {
            background: linear-gradient(90deg, #eff4ff 0%, #ffffff 50%, #eff4ff 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen">
<!-- Top App Bar -->
<header class="docked full-width top-0 sticky bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] flex justify-between items-center w-full px-margin-mobile h-16 z-50">
<button class="hover:brightness-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-inverse-primary">UniLoop</div>
<button class="hover:brightness-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<main class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-lg grid grid-cols-1 md:grid-cols-2 gap-xl">
<!-- Artboard 1: No Internet Error State -->
<section class="bg-surface rounded-[24px] shadow-[0px_4px_12px_rgba(15,23,42,0.05)] p-xl flex flex-col items-center justify-center min-h-[500px] text-center border border-outline-variant/30">
<div class="w-24 h-24 rounded-full bg-error-container/20 flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-[48px] text-error" data-icon="wifi_off">wifi_off</span>
</div>
<h2 class="text-headline-md font-headline-md text-on-surface mb-sm">Mất kết nối mạng</h2>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px] mb-lg">
                Vui lòng kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động của bạn và thử lại.
            </p>
<button class="bg-primary text-on-primary rounded-[16px] px-lg py-sm text-button font-button hover:brightness-90 active:scale-[0.98] transition-all flex items-center gap-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                Thử lại
            </button>
</section>
<!-- Artboard 2: Skeleton Loading State -->
<section class="bg-surface rounded-[24px] shadow-[0px_4px_12px_rgba(15,23,42,0.05)] p-md md:p-lg min-h-[500px] border border-outline-variant/30">
<div class="flex justify-between items-center mb-lg">
<div class="h-6 w-32 skeleton-shimmer rounded-md bg-surface-container-low"></div>
<div class="h-8 w-24 skeleton-shimmer rounded-[16px] bg-surface-container-low"></div>
</div>
<div class="grid grid-cols-2 gap-gutter">
<!-- Skeleton Item 1 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-sm overflow-hidden flex flex-col">
<div class="h-32 w-full skeleton-shimmer bg-surface-container-low"></div>
<div class="p-sm flex flex-col gap-sm">
<div class="h-4 w-3/4 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-4 w-1/2 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-6 w-1/3 skeleton-shimmer rounded-md bg-surface-container-low mt-sm"></div>
</div>
</div>
<!-- Skeleton Item 2 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-sm overflow-hidden flex flex-col">
<div class="h-32 w-full skeleton-shimmer bg-surface-container-low"></div>
<div class="p-sm flex flex-col gap-sm">
<div class="h-4 w-4/5 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-4 w-2/3 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-6 w-2/5 skeleton-shimmer rounded-md bg-surface-container-low mt-sm"></div>
</div>
</div>
<!-- Skeleton Item 3 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-sm overflow-hidden flex flex-col">
<div class="h-32 w-full skeleton-shimmer bg-surface-container-low"></div>
<div class="p-sm flex flex-col gap-sm">
<div class="h-4 w-3/4 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-4 w-1/2 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-6 w-1/3 skeleton-shimmer rounded-md bg-surface-container-low mt-sm"></div>
</div>
</div>
<!-- Skeleton Item 4 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-sm overflow-hidden flex flex-col">
<div class="h-32 w-full skeleton-shimmer bg-surface-container-low"></div>
<div class="p-sm flex flex-col gap-sm">
<div class="h-4 w-4/5 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-4 w-2/3 skeleton-shimmer rounded bg-surface-container-low"></div>
<div class="h-6 w-2/5 skeleton-shimmer rounded-md bg-surface-container-low mt-sm"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Nav Bar (Suppressed as per rules since this is an error/loading demo page which implies dead end or linear flow, but adding for semantic completeness if needed, however rule says "suppress the navigation to prioritize the content canvas". So I will leave it out.) -->
