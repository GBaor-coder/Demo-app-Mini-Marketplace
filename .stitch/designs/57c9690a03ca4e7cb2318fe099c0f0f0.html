<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thêm địa chỉ mới</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed": "#00174b",
                      "tertiary": "#006229",
                      "on-secondary-fixed-variant": "#004395",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "surface-container-low": "#eff4ff",
                      "secondary-fixed": "#d8e2ff",
                      "surface-dim": "#cbdbf5",
                      "primary-container": "#2563eb",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-tertiary-fixed-variant": "#005321",
                      "background": "#f8f9ff",
                      "surface-tint": "#0053db",
                      "surface-container": "#e5eeff",
                      "inverse-on-surface": "#eaf1ff",
                      "inverse-primary": "#b4c5ff",
                      "on-secondary-container": "#fefcff",
                      "secondary": "#0058be",
                      "secondary-fixed-dim": "#adc6ff",
                      "outline-variant": "#c3c6d7",
                      "surface": "#f8f9ff",
                      "outline": "#737686",
                      "tertiary-fixed": "#6bff8f",
                      "inverse-surface": "#213145",
                      "primary": "#004ac6",
                      "on-surface": "#0b1c30",
                      "tertiary-fixed-dim": "#4ae176",
                      "on-error-container": "#93000a",
                      "on-primary": "#ffffff",
                      "on-tertiary-container": "#c1ffc5",
                      "on-tertiary-fixed": "#002109",
                      "tertiary-container": "#007e37",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed": "#dbe1ff",
                      "on-surface-variant": "#434655",
                      "secondary-container": "#2170e4",
                      "surface-variant": "#d3e4fe",
                      "on-tertiary": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#d3e4fe",
                      "on-secondary-fixed": "#001a42",
                      "on-background": "#0b1c30",
                      "on-primary-container": "#eeefff",
                      "primary-fixed-dim": "#b4c5ff",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px",
                      "2xl": "1.25rem",
                      "3xl": "1.5rem",
              },
              "spacing": {
                      "md": "16px",
                      "lg": "24px",
                      "margin-mobile": "20px",
                      "margin-desktop": "40px",
                      "xl": "32px",
                      "base": "4px",
                      "xs": "4px",
                      "sm": "8px",
                      "2xl": "48px",
                      "gutter": "16px",
                      "safe": "env(safe-area-inset-bottom)"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "button": ["Inter"],
                      "headline-sm": ["Inter"],
                      "headline-md": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "display-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "button": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-sm-mobile": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-[100px] font-body-md">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl docked full-width top-0 sticky shadow-[0px_4px_12px_rgba(15,23,42,0.05)] flex justify-between items-center w-full px-margin-mobile h-16 z-50">
<button class="text-on-surface hover:brightness-90 transition-all active:scale-95 duration-200 p-2 -ml-2 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm-mobile font-headline-sm-mobile font-bold text-primary dark:text-inverse-primary truncate flex-1 text-center">Thêm địa chỉ mới</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="max-w-3xl mx-auto px-margin-mobile pt-lg pb-2xl space-y-lg">
<!-- Thông tin liên hệ -->
<section class="bg-surface rounded-2xl p-md shadow-[0px_4px_12px_rgba(15,23,42,0.05)] border border-outline-variant/30 space-y-md">
<h2 class="text-headline-sm font-headline-sm text-on-surface">Thông tin liên hệ</h2>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="name">Họ tên <span class="text-error">*</span></label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="name" placeholder="Nguyễn Văn A" type="text"/>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="phone">Số điện thoại <span class="text-error">*</span></label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="phone" placeholder="0123 456 789" type="tel"/>
</div>
</section>
<!-- Địa chỉ -->
<section class="bg-surface rounded-2xl p-md shadow-[0px_4px_12px_rgba(15,23,42,0.05)] border border-outline-variant/30 space-y-md">
<h2 class="text-headline-sm font-headline-sm text-on-surface">Địa chỉ</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant">Tỉnh/Thành phố <span class="text-error">*</span></label>
<div class="relative relative">
<select class="w-full appearance-none bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
<option value="">Chọn Tỉnh/Thành phố</option>
<option value="hcm">Hồ Chí Minh</option>
<option value="hn">Hà Nội</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant">Quận/Huyện <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full appearance-none bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
<option value="">Chọn Quận/Huyện</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant">Phường/Xã <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full appearance-none bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
<option value="">Chọn Phường/Xã</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="street">Tên đường, Tòa nhà, Số nhà <span class="text-error">*</span></label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="street" placeholder="VD: 123 Đường Nguyễn Văn Linh" type="text"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="building">Tòa/Khu/KTX</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="building" placeholder="Tòa A" type="text"/>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="room">Số phòng</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="room" placeholder="Phòng 101" type="text"/>
</div>
</div>
</section>
<!-- Vị trí bản đồ -->
<section class="bg-surface rounded-2xl p-md shadow-[0px_4px_12px_rgba(15,23,42,0.05)] border border-outline-variant/30 space-y-md">
<div class="flex justify-between items-center">
<h2 class="text-headline-sm font-headline-sm text-on-surface">Vị trí chính xác</h2>
<button class="flex items-center gap-xs text-primary text-label-md font-label-md hover:brightness-90 transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="my_location">my_location</span>
                    Dùng vị trí hiện tại
                </button>
</div>
<div class="relative w-full h-48 rounded-xl overflow-hidden bg-surface-variant/50 border border-outline-variant/30 group">
<img class="w-full h-full object-cover" data-alt="A modern UI map interface showing a generic city layout with light grey roads, soft blue water bodies, and a clean minimalist aesthetic. The map should look like a digital app integration, high key lighting, crisp details." data-location="Ho Chi Minh City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHlGZN9ADKcQLo67cZ5U5UyEFm2F4C3fJJBL2vG8gu9zuT0tXfo5FT3Y5X4xVL_zWq9FyB3G3HHcv_EmoNm_j8LWipSdKVQI5HJ7Aa-wzVRy86MJrD43JUtD-7b_kkOgyXf7NhaeriCL9TfE7wF7bGIsvnkMUals2jRVx38MjFwbmSNOk6xmNwKXpFgjl8DWOjMjB-fV7a1kYYhFoSMuyIadZWhtYIFmBCVrirdkWUodoIALIO4Nf8"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-error text-[40px] drop-shadow-md" data-icon="location_on" data-weight="fill">location_on</span>
</div>
<div class="absolute bottom-sm left-sm right-sm bg-surface/90 backdrop-blur-sm rounded-lg p-sm shadow-sm">
<p class="text-body-sm font-body-sm text-on-surface line-clamp-1">123 Nguyễn Văn Linh, Phường Tân Phong, Quận 7</p>
</div>
</div>
</section>
<!-- Cài đặt khác -->
<section class="bg-surface rounded-2xl p-md shadow-[0px_4px_12px_rgba(15,23,42,0.05)] border border-outline-variant/30 space-y-md">
<h2 class="text-headline-sm font-headline-sm text-on-surface">Loại địa chỉ</h2>
<div class="flex gap-sm">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="addressType" type="radio" value="home"/>
<div class="h-10 rounded-full border border-outline-variant flex items-center justify-center gap-2 text-on-surface-variant font-button text-button peer-checked:bg-primary-container/20 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="home">home</span>
                        Nhà riêng
                    </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="addressType" type="radio" value="dorm"/>
<div class="h-10 rounded-full border border-outline-variant flex items-center justify-center gap-2 text-on-surface-variant font-button text-button peer-checked:bg-primary-container/20 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="apartment">apartment</span>
                        Ký túc xá
                    </div>
</label>
</div>
<div class="space-y-sm pt-sm">
<label class="block text-label-md font-label-md text-on-surface-variant" for="notes">Ghi chú giao hàng (Tùy chọn)</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all resize-none" id="notes" placeholder="Ví dụ: Gọi trước khi giao, giao giờ hành chính..." rows="2"></textarea>
</div>
<div class="flex items-center gap-sm pt-sm">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="default" type="checkbox"/>
<label class="text-body-md font-body-md text-on-surface" for="default">Đặt làm địa chỉ mặc định</label>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl border-t border-outline-variant/20 p-margin-mobile pb-[calc(20px+env(safe-area-inset-bottom))] z-50">
<button class="w-full bg-primary hover:brightness-90 text-on-primary font-button text-button py-sm px-lg h-12 rounded-full shadow-[0px_4px_12px_rgba(37,99,235,0.2)] active:scale-95 transition-all flex items-center justify-center gap-sm">
            Hoàn thành
        </button>
</div>
</body></html>
