<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - UniLoop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f8f9ff",
                        "on-primary-container": "#eeefff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#0053db",
                        "secondary-container": "#2170e4",
                        "secondary": "#0058be",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#004395",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#0b1c30",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-fixed": "#001a42",
                        "background": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed": "#6bff8f",
                        "on-tertiary-fixed-variant": "#005321",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#c1ffc5",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "primary-container": "#2563eb",
                        "tertiary-container": "#007e37",
                        "outline-variant": "#c3c6d7",
                        "surface-variant": "#d3e4fe",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-container": "#fefcff",
                        "inverse-surface": "#213145",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container": "#e5eeff",
                        "primary": "#004ac6",
                        "tertiary-fixed-dim": "#4ae176",
                        "on-surface": "#0b1c30",
                        "tertiary": "#006229",
                        "on-primary-fixed": "#00174b",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#002109",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "2xl": "48px",
                        "margin-desktop": "40px",
                        "base": "4px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "button": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px] px-margin-mobile z-10">
<!-- Glass Card -->
<div class="bg-surface-container-lowest/90 backdrop-blur-xl rounded-[24px] shadow-[0px_12px_32px_rgba(15,23,42,0.08)] p-xl border border-outline-variant/30 flex flex-col gap-lg">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-sm">
<!-- Logo -->
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-[20px] flex items-center justify-center mb-sm shadow-[0px_8px_24px_rgba(37,99,235,0.2)]">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">sync</span>
</div>
<h1 class="text-display-lg-mobile font-display-lg-mobile text-primary">UniLoop</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="email">Email trường học</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 bg-surface pl-[44px] pr-4 rounded-[16px] border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-body-md font-body-md text-on-surface placeholder:text-outline-variant" id="email" placeholder="student@university.edu.vn" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 bg-surface pl-[44px] pr-[44px] rounded-[16px] border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-body-md font-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password & Remember Me -->
<div class="flex justify-between items-center mt-[-8px]">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-surface" type="checkbox"/>
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Nhớ tài khoản</span>
</label>
<a class="text-label-md font-label-md text-primary hover:text-secondary transition-colors font-medium" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary Login Button -->
<button class="w-full h-12 bg-primary-container text-on-primary rounded-[16px] text-button font-button flex items-center justify-center gap-2 hover:brightness-90 active:scale-[0.98] transition-all mt-sm shadow-[0px_4px_12px_rgba(37,99,235,0.2)]" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="text-label-md font-label-md text-outline">Hoặc</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Guest Access / Demo -->
<button class="w-full h-12 bg-surface-container-high text-on-surface rounded-[16px] text-button font-button flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors border border-outline-variant/30 active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">explore</span>
                Trải nghiệm Demo (Guest)
            </button>
<!-- Sign Up Link -->
<p class="text-center text-body-sm font-body-sm text-on-surface-variant mt-sm">
                Chưa có tài khoản? 
                <a class="text-primary font-medium hover:underline decoration-2 underline-offset-4" href="#">Đăng ký ngay</a>
</p>
</div>
</main>
<script>
        // Password Visibility Toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
