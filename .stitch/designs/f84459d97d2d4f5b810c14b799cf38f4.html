<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-3xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] p-lg md:p-xl relative overflow-hidden">
<!-- Decorative Header -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile md:font-display-lg text-primary mb-sm">UniLoop</h1>
<h2 class="text-headline-md font-headline-md text-on-surface">Tạo tài khoản mới</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-sm">Tham gia cộng đồng sinh viên ngay hôm nay.</p>
</div>
<!-- Registration Form -->
<form class="space-y-md">
<!-- Họ tên -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="fullname">Họ và tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-2xl text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required="" type="text"/>
</div>
</div>
<!-- Email Sinh Viên -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="email">Email sinh viên (edu.vn)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-2xl text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="email" name="email" pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.edu\.vn$" placeholder="nguyenvana@student.edu.vn" required="" type="email"/>
</div>
<p class="text-body-sm font-body-sm text-outline mt-1 text-xs">* Vui lòng sử dụng email do trường cấp.</p>
</div>
<!-- Số điện thoại -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="phone">Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">phone</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-2xl text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="phone" name="phone" placeholder="0912345678" required="" type="tel"/>
</div>
</div>
<!-- Mật khẩu -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-2xl text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Xác nhận mật khẩu -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">swipe_left_alt</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-2xl text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm mt-md">
<input class="mt-1 w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary" id="terms" type="checkbox"/>
<label class="text-body-sm font-body-sm text-on-surface-variant" for="terms">
                    Tôi đồng ý với các <a class="text-primary hover:underline" href="#">Điều khoản sử dụng</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a> của UniLoop.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary text-on-primary rounded-2xl text-button font-button flex items-center justify-center gap-sm hover:brightness-90 active:scale-95 transition-all mt-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)]" type="submit">
                Đăng ký tài khoản
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Login Link -->
<div class="mt-xl text-center text-body-sm font-body-sm text-on-surface-variant">
            Đã có tài khoản? <a class="text-primary font-semibold hover:underline" href="#">Đăng nhập tại đây</a>
</div>
</div>
