<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="docked full-width top-0 sticky bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-sm flex justify-between items-center w-full px-margin-mobile h-16 z-50 shadow-[0px_4px_12px_rgba(15,23,42,0.05)]">
<button aria-label="Go back" class="text-primary dark:text-inverse-primary hover:brightness-90 transition-all flex items-center justify-center w-10 h-10 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm-mobile font-headline-sm-mobile md:text-headline-sm md:font-headline-sm font-bold text-primary dark:text-inverse-primary">Xác nhận địa điểm</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-margin-mobile py-lg max-w-[600px] mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex items-center justify-center mb-lg space-x-2">
<div class="w-8 h-2 rounded-full bg-outline-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary"></div>
<div class="w-8 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Mini Map -->
<div class="rounded-xl overflow-hidden shadow-sm border border-outline-variant/30 mb-lg relative h-48 bg-surface-container-high">
<!-- Simulated Map -->
<img class="w-full h-full object-cover" data-alt="A clean, modern top-down satellite or stylized vector map view of a university campus. The map should use light mode colors: soft grays for roads, vibrant greens for lawns, and crisp white for buildings. The lighting is bright and even. The aesthetic is highly legible and functional, fitting a professional SaaS platform designed for students." data-location="University Campus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_WR1eKFtsvDCdvF7HsHY51dwmOMvnnhz8JJJCncHei4NtoOw36a18uLrf3CtzupvOeTnMrKDIGXonpWaZjfzVZBA1vNP_hCsuZVp1Xwun8bdABmjISAA3-jbt7_vfGcIUDEzAO7ktNPUFrj3PsVCZF0wLRFqS2etC2_JX8S1n4PdGcYmHO0KtwziwV790TnZEgAcpTQ9FtIcLlaE67NxUUFznOrJeRF_CUuy4noegcX7fR_m5Ei0m"/>
<!-- Pin -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="flex flex-col items-center animate-bounce">
<div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center shadow-md border-2 border-white">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="w-2 h-2 bg-on-background/30 rounded-full mt-1 blur-[2px]"></div>
</div>
</div>
<!-- Recenter Button -->
<button class="absolute bottom-md right-md bg-surface text-on-surface p-2 rounded-full shadow-md hover:bg-surface-variant transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-primary">my_location</span>
</button>
</div>
<!-- Search Address -->
<div class="mb-lg relative">
<label class="sr-only" for="address-search">Tìm kiếm địa chỉ</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-on-surface placeholder:text-outline" id="address-search" placeholder="Tìm kiếm địa chỉ, tòa nhà, ký túc xá..." type="text" value="Ký túc xá Bách Khoa, Tòa B1"/>
</div>
<!-- Form Details -->
<div class="bg-surface-container-lowest p-md md:p-lg rounded-2xl shadow-sm border border-outline-variant/20 space-y-md">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface font-medium" for="building">Tên tòa nhà/Ký túc xá <span class="text-error">*</span></label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-on-surface" id="building" placeholder="VD: Tòa D5, KTX Sinh viên" type="text" value="Ký túc xá Bách Khoa, Tòa B1"/>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface font-medium" for="room">Số phòng / Tầng <span class="text-outline font-normal">(Tùy chọn)</span></label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-on-surface" id="room" placeholder="VD: Phòng 402, Tầng 4" type="text"/>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface font-medium" for="note">Ghi chú điểm hẹn <span class="text-outline font-normal">(Tùy chọn)</span></label>
<textarea class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-on-surface resize-none" id="note" placeholder="VD: Gặp ở cổng chính, tôi mặc áo khoác đỏ..." rows="3"></textarea>
</div>
<!-- Saved Locations Chips -->
<div class="pt-sm border-t border-outline-variant/20 mt-md">
<span class="block font-label-md text-label-md text-on-surface-variant mb-sm">Địa điểm đã lưu</span>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 rounded-full bg-primary/10 text-primary font-label-md text-label-md border border-primary/20 hover:bg-primary/20 transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">home</span>
                        Ký túc xá
                    </button>
<button class="px-3 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-label-md border border-outline-variant/30 hover:bg-surface-variant/80 transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">school</span>
                        Thư viện
                    </button>
</div>
</div>
</div>
<!-- Spacer for bottom button -->
<div class="h-24"></div>
</main>
<!-- Fixed Bottom Button -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 shadow-[0px_-4px_12px_rgba(15,23,42,0.05)] z-40">
<div class="max-w-[600px] mx-auto">
<button class="w-full bg-primary hover:brightness-90 active:scale-[0.98] transition-all text-white font-button text-button py-3 rounded-[16px] shadow-sm flex items-center justify-center gap-2">
                Xác nhận địa điểm
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
