<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sửa sản phẩm - UniLoop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#c1ffc5",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#001a42",
                        "tertiary-fixed": "#6bff8f",
                        "tertiary-container": "#007e37",
                        "outline-variant": "#c3c6d7",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-fixed": "#002109",
                        "on-surface": "#0b1c30",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "secondary": "#0058be",
                        "primary": "#004ac6",
                        "surface-container": "#e5eeff",
                        "inverse-primary": "#b4c5ff",
                        "secondary-fixed": "#d8e2ff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#004395",
                        "error": "#ba1a1a",
                        "outline": "#737686",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#eff4ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed-variant": "#005321",
                        "secondary-container": "#2170e4",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-surface": "#213145",
                        "tertiary-fixed-dim": "#4ae176",
                        "tertiary": "#006229",
                        "surface-variant": "#d3e4fe",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-background": "#0b1c30",
                        "surface": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#fefcff",
                        "on-tertiary": "#ffffff",
                        "custom-purple": "#8B5CF6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xl": "32px",
                        "2xl": "48px",
                        "xs": "4px",
                        "sm": "8px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "margin-desktop": "40px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "button": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "button": ["16px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #f8f9ff; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-md antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] docked full-width top-0 sticky z-50 transition-transform duration-200">
<div class="flex justify-between items-center w-full px-margin-mobile h-16 z-50 max-w-7xl mx-auto">
<button class="text-primary dark:text-inverse-primary hover:brightness-90 transition-all flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-inverse-primary">UniLoop</div>
<button class="text-primary dark:text-inverse-primary hover:brightness-90 transition-all flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile pt-lg pb-2xl">
<div class="mb-lg">
<h1 class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile md:font-display-lg text-on-surface mb-sm">Sửa sản phẩm</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Cập nhật thông tin cho sản phẩm của bạn.</p>
</div>
<form class="space-y-lg">
<!-- Hình ảnh -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)]">
<label class="block text-label-md font-label-md text-on-surface mb-sm">Hình ảnh sản phẩm</label>
<div class="flex gap-sm overflow-x-auto pb-2 snap-x">
<div class="relative flex-none w-32 h-32 rounded-lg overflow-hidden border border-outline-variant snap-start">
<img class="w-full h-full object-cover" data-alt="A close-up, highly detailed photograph of a calculus textbook on a wooden desk, soft natural light streaming from a window, shallow depth of field, modern bright aesthetic, clean and academic atmosphere, vibrant colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4_2e70jypzRPf1b0Hr5Zh1xmclgsPvgRwtImYVgiI8HyNWFXDpQyCPrtdoQNdEHuAQJ0B7fMA3HGgV3R4g_OaTsGM_nZvZjNqTa1Rvw0rvfpfxnhqcY1UBOcnTao3_-xMjuNy93vM7vyKjQZ1FdA1L5p3xCt-jv7yievzGzfCTcQB_Rw3lR7Aqq5k8weBcxpur0fpsQX_t4X8Wn-EZFyik07-tYurLk_vkSCWbvUYMqqf8238NN-o"/>
<button class="absolute top-1 right-1 bg-surface-container/80 backdrop-blur-sm rounded-full p-1 text-error hover:bg-error-container transition-colors" type="button">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">close</span>
</button>
</div>
<div class="flex-none w-32 h-32 rounded-lg border-2 border-dashed border-primary-container bg-surface flex flex-col items-center justify-center text-primary-container cursor-pointer hover:bg-primary-container/5 transition-colors snap-start">
<span class="material-symbols-outlined mb-1">add_photo_alternate</span>
<span class="text-body-sm font-body-sm">Thêm ảnh</span>
</div>
</div>
</div>
<!-- Thông tin cơ bản -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] space-y-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="title">Tên sản phẩm *</label>
<input class="w-full rounded-[16px] border-[#E2E8F0] bg-[#F8FAFC] text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all p-3" id="title" placeholder="Nhập tên sản phẩm" type="text" value="Giáo trình Giải tích 1"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="price">Giá (VNĐ) *</label>
<input class="w-full rounded-[16px] border-[#E2E8F0] bg-[#F8FAFC] text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all p-3" id="price" placeholder="0" type="text" value="50.000"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="category">Danh mục</label>
<div class="relative">
<select class="w-full rounded-[16px] border-[#E2E8F0] bg-[#F8FAFC] text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all p-3 appearance-none" id="category">
<option>Sách / Giáo trình</option>
<option>Đồ dùng học tập</option>
<option>Điện tử</option>
<option>Khác</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="desc">Mô tả chi tiết</label>
<textarea class="w-full rounded-[16px] border-[#E2E8F0] bg-[#F8FAFC] text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all p-3" id="desc" placeholder="Mô tả tình trạng, năm xuất bản, v.v." rows="4">Sách còn mới 90%, không ghi chú bên trong. Dùng cho sinh viên năm nhất khối kỹ thuật.</textarea>
</div>
</div>
<!-- Giao dịch -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] space-y-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="location">Địa điểm giao dịch</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full rounded-[16px] border-[#E2E8F0] bg-[#F8FAFC] text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all p-3 pl-10" id="location" placeholder="VD: Cổng trường, Thư viện..." type="text" value="KTX Khu B, ĐHQG HCM"/>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-md pt-md">
<button class="flex-1 bg-[#E2E8F0] text-[#0F172A] text-button font-button rounded-[16px] py-3 hover:brightness-90 active:scale-95 transition-all flex items-center justify-center" type="button">
                    Hủy
                </button>
<button class="flex-1 bg-[#8B5CF6] text-white text-button font-button rounded-[16px] py-3 hover:brightness-90 active:scale-95 transition-all flex items-center justify-center shadow-md" type="submit">
                    Lưu thay đổi
                </button>
</div>
</form>
</main>
</body></html>
