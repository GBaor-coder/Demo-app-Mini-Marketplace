<!-- Simple JS for Star Rating Interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('#star-container span');
            const ratingText = document.getElementById('rating-text');
            const texts = ["Rất tệ", "Tệ", "Bình thường", "Tốt", "Tuyệt vời"];
            
            let currentRating = 4; // Default to 4 stars as visually set

            const updateStars = (rating) => {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.classList.add('active');
                        star.classList.add('text-primary-container');
                    } else {
                        star.classList.remove('active');
                        star.classList.remove('text-primary-container');
                    }
                });
                if(rating > 0) {
                     ratingText.textContent = texts[rating - 1];
                     ratingText.classList.remove('opacity-0');
                }
            };

            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    currentRating = parseInt(e.target.getAttribute('data-value'));
                    updateStars(currentRating);
                });

                // Hover effects are mostly handled by CSS, but JS helps solidify state
                star.addEventListener('mouseenter', (e) => {
                    const hoverValue = parseInt(e.target.getAttribute('data-value'));
                    updateStars(hoverValue);
                });
            });
            
            const container = document.getElementById('star-container');
            container.addEventListener('mouseleave', () => {
                updateStars(currentRating);
            });
        });
    </script>
